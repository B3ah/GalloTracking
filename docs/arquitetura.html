<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Gallo Tracking | Arquitetura</title>
  <style>
    :root { --bg:#101827; --panel:#172235; --card:#1f2d43; --ink:#f8fafc; --muted:#9fb0c5; --line:#60738f; --blue:#60a5fa; --green:#34d399; --pink:#f472b6; --amber:#fbbf24; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif; background:radial-gradient(circle at 15% 10%,#27466d 0,#101827 42%),var(--bg); display:grid; place-items:center; padding:20px; }
    .deck { width:min(1180px,100%); } .topbar { display:flex; justify-content:space-between; align-items:center; margin:0 4px 14px; color:var(--muted); font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; } .topbar > button { display:grid; place-items:center; width:38px; height:38px; padding:0; }
    .brand { color:var(--ink); font-weight:800; } .brand span { color:var(--blue); } .slide { position:relative; display:none; min-height:650px; padding:clamp(28px,5vw,64px); border:1px solid #ffffff18; border-radius:28px; background:linear-gradient(145deg,#1b2a40f5,#121c2cf5); box-shadow:0 30px 90px #0008; overflow:hidden; isolation:isolate; } .slide::before { content:""; position:absolute; z-index:-1; width:360px; height:360px; right:-130px; top:-160px; border-radius:50%; background:#60a5fa18; filter:blur(10px); } .slide.active { display:block; animation:show .3s ease-out; } @keyframes show { from { opacity:0; transform:translateY(10px) scale(.99); } to { opacity:1; transform:none; } }
    .eyebrow { color:var(--blue); font-size:.78rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; } h1 { max-width:760px; margin:16px 0 12px; font-size:clamp(2.2rem,6vw,5rem); line-height:1.02; } h2 { margin:14px 0 12px; font-size:clamp(1.8rem,4vw,3.2rem); } p { max-width:760px; color:var(--muted); line-height:1.7; font-size:clamp(.95rem,1.5vw,1.1rem); }
    .diagram { display:flex; align-items:center; justify-content:center; gap:clamp(8px,2vw,20px); margin:52px auto 24px; flex-wrap:wrap; } .node { min-width:150px; max-width:240px; padding:18px 16px; text-align:center; border:1px solid #ffffff28; border-radius:16px; background:var(--card); box-shadow:0 10px 24px #0002; font-weight:800; transition:transform .2s ease,box-shadow .2s ease; } .node:hover { transform:translateY(-3px); box-shadow:0 14px 28px #0004; } .node small { display:block; margin-top:8px; color:var(--muted); font-size:.75rem; font-weight:500; line-height:1.4; } .driver { border-color:#60a5fa99; background:#19395d; } .server { border-color:#94a3b899; } .web { border-color:#f472b699; background:#522644; } .db { border-color:#34d39999; background:#17483e; } .warn { border-color:#fbbf2499; background:#514019; }
    .connector { position:relative; width:64px; height:2px; flex:0 0 64px; background:var(--blue); } .connector::after { content:""; position:absolute; right:-1px; top:-5px; border-width:6px 0 6px 9px; border-style:solid; border-color:transparent transparent transparent var(--blue); } .connector label { position:absolute; left:50%; bottom:9px; transform:translateX(-50%); color:var(--muted); font-size:.68rem; white-space:nowrap; } .connector.vertical { width:2px; height:28px; flex-basis:2px; background:var(--line); } .connector.vertical::after { right:auto; left:-5px; top:auto; bottom:-1px; border-width:9px 6px 0; border-color:var(--line) transparent transparent; } .stack { display:grid; justify-items:center; gap:8px; max-width:520px; margin:42px auto; } .stack .node { width:100%; max-width:520px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin:40px auto; max-width:720px; } .grid .node { max-width:none; text-align:left; } .flow { margin-top:46px; } .progress { height:4px; margin-top:16px; overflow:hidden; border-radius:9px; background:#ffffff18; } .progress i { display:block; height:100%; width:8.33%; background:linear-gradient(90deg,var(--blue),var(--green)); transition:width .3s; } .code { max-width:760px; margin:34px auto; padding:22px; overflow:auto; border:1px solid #ffffff18; border-radius:16px; color:#c7f9e6; background:#0a1220; box-shadow:inset 0 0 30px #0004; font:500 .82rem/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; text-align:left; } .bullets { display:grid; gap:12px; max-width:720px; margin:34px auto; } .bullets div { padding:14px 16px; border-left:3px solid var(--blue); border-radius:8px; color:var(--muted); background:#ffffff09; }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:16px 4px 0; } .controls button { border:1px solid #ffffff20; border-radius:12px; padding:11px 16px; color:var(--ink); background:#ffffff12; cursor:pointer; transition:background .2s,transform .2s; } .controls button:hover:not(:disabled) { background:#ffffff22; transform:translateY(-1px); } button:disabled { cursor:default; opacity:.35; } #counter { color:var(--muted); font-size:.82rem; } .hint { color:#71839c; font-size:.72rem; text-align:center; }
    @media (max-width:700px) { body { padding:10px; } .slide { min-height:670px; padding:28px 22px; } .diagram { margin-top:35px; } .connector { width:38px; flex-basis:38px; } .node { min-width:125px; padding:15px 10px; } .flow .connector { transform:rotate(90deg); margin:7px 0; } .flow { flex-direction:column; } .grid { grid-template-columns:1fr; } }
    @media (prefers-reduced-motion:reduce) { .slide.active { animation:none; } }
  </style>
</head>
<body>
  <main class="deck">
    <div class="topbar"><span class="brand"><span>Gallo</span> Tracking</span><span id="title">Arquitetura</span><button id="fullscreen" type="button" aria-label="Ativar tela cheia" title="Tela cheia"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button></div>
    <div id="slides"></div><div class="progress"><i id="progress"></i></div>
    <div class="controls"><button id="prev">&#8592; Anterior</button><span id="counter">1 / 12</span><button id="next">Pr&oacute;ximo &#8594;</button></div>
    <div class="hint">Use as setas do teclado, Espa&ccedil;o ou deslize para navegar</div>
  </main>
  <script>
    const slides = [
      { title:'Arquitetura do sistema', text:'Vis&atilde;o geral do aplicativo do motorista, back-end central, painel web e persist&ecirc;ncia.', items:[['App Motorista','GPS &middot; SQLite offline','driver'],['Back-end','REST &middot; regras &middot; SignalR','server'],['Painel Web','mapa e gestor','web'],['SQLite / PostgreSQL','rotas &middot; entregas &middot; localiza&ccedil;&otilde;es','db']], links:['HTTPS','HTTPS / WebSocket'] },
      { title:'Organiza&ccedil;&atilde;o interna do back-end', text:'O mon&oacute;lito &eacute; modular: cada camada concentra uma responsabilidade.', stack:[['API Controllers','autentica&ccedil;&atilde;o &middot; rotas &middot; entregas &middot; localiza&ccedil;&atilde;o','driver'],['Services','regras de neg&oacute;cio e valida&ccedil;&otilde;es','server'],['Infrastructure','EF Core &middot; SQLite &middot; APIs externas','db']] },
      { title:'Comunica&ccedil;&atilde;o REST', text:'Opera&ccedil;&otilde;es convencionais usam HTTP: enviar, validar, persistir e responder.', items:[['Aplicativo','requisi&ccedil;&atilde;o HTTPS','driver'],['API','validar e salvar','server'],['Banco','resposta de sucesso','db']], links:['REST',''] },
      { title:'Localiza&ccedil;&atilde;o em tempo real', text:'A localiza&ccedil;&atilde;o passa pelo back-end antes de ser distribu&iacute;da ao painel.', items:[['Motorista','envia GPS por REST','driver'],['Back-end','valida e persiste','server'],['Painel Web','atualiza marcador','web']], links:['','SignalR'] },
      { title:'Grupos por rota', text:'Cada rota possui um grupo SignalR. Gestores recebem apenas os eventos de sua rota.', grid:[['Gestores','entram no grupo rota-25','web'],['Grupo Rota 25','novaLocalizacao','server'],['Motorista','envia localiza&ccedil;&atilde;o','driver'],['Outras rotas','n&atilde;o recebem o evento','db']] },
      { title:'Modo offline', text:'Store-and-Forward evita a perda de coordenadas sem internet.', items:[['GPS','captura coordenadas','driver'],['Sem internet?','sim &rarr; SQLite local','warn'],['Sincroniza&ccedil;&atilde;o','envio batch ao voltar','server']], links:['',''] },
      { title:'Relacionamento entre entidades', text:'A cadeia de dados conecta usu&aacute;rio, motorista, rota e seus registros.', items:[['Usu&aacute;rio','1:1','driver'],['Motorista','1:N','driver'],['Rota','1:N','server']], links:['1:1','1:N'], extra:[['Entrega','v&aacute;rias por rota','warn'],['Localiza&ccedil;&atilde;o','hist&oacute;rico GPS','db']] },
      { title:'Estados da rota', text:'O GPS s&oacute; &eacute; aceito durante o estado ativo, protegendo a privacidade.', items:[['Planejada','sem rastreamento','server'],['Ativa','GPS permitido','db'],['Finalizada','rastreamento encerrado','warn']], links:['',''] },
      { title:'Fluxo completo', text:'GPS, conectividade, persist&ecirc;ncia, sincroniza&ccedil;&atilde;o e painel em um &uacute;nico fluxo.', stack:[['Iniciar rota &rarr; capturar GPS','','driver'],['Offline &rarr; guardar SQLite | Online &rarr; enviar REST','','warn'],['Back-end valida rota ativa','','server'],['Salvar hist&oacute;rico &rarr; publicar SignalR','','db'],['Painel atualiza o mapa','','web']] },
      { title:'Rotas principais da API', text:'O Swagger exp&otilde;e os contratos HTTP para simular o aplicativo e o painel do gestor.', code:'POST   /api/auth/login\nGET    /api/rotas\nPOST   /api/rotas/{id}/iniciar\nPOST   /api/localizacoes\nPOST   /api/localizacoes/batch\nGET    /api/rotas/{id}/localizacoes\nPATCH  /api/entregas/{id}/status' },
      { title:'Fluxo de uma localiza&ccedil;&atilde;o', text:'Cada ponto segue o mesmo caminho, seja enviado individualmente ou em lote.', bullets:['1. O motorista faz login e recebe um JWT.','2. O cliente envia latitude, longitude, timestamp e idLocal.','3. A API valida o token, o dono da rota e o status Ativa.','4. O SQLite evita duplicidade usando motorista + idLocal.','5. O registro &eacute; salvo e o SignalR publica novaLocalizacao.'] },
      { title:'Como o c&oacute;digo est&aacute; dividido', text:'A organiza&ccedil;&atilde;o separa entrada HTTP, regras de neg&oacute;cio e persist&ecirc;ncia.', grid:[['Controllers','recebem requests e retornam DTOs','driver'],['Services','aplicam regras e autorizam a&ccedil;&otilde;es','server'],['Domain','entidades, estados e contratos','warn'],['Infrastructure','EF Core, SQLite, seed e migrations','db']] }
    ];
    const root=document.querySelector('#slides'), prev=document.querySelector('#prev'), next=document.querySelector('#next'), counter=document.querySelector('#counter'), progress=document.querySelector('#progress'); let current=0;
    const node = ([name,detail,kind]) => `<div class="node ${kind||''}">${name}${detail?`<small>${detail}</small>`:''}</div>`;
    const connectors = links => links.map(label=>`<div class="connector"><label>${label||''}</label></div>`).join('');
    function renderSlide(data){ let content=''; if(data.items) content=`<div class="diagram">${data.items.map((item,i)=>node(item)+(i<data.items.length-1?`<div class="connector"><label>${data.links?.[i]||''}</label></div>`:'')).join('')}</div>`; if(data.stack) content=`<div class="stack">${data.stack.map((item,i)=>node(item)+(i<data.stack.length-1?'<div class="connector vertical"></div>':'')).join('')}</div>`; if(data.grid) content=`<div class="grid">${data.grid.map(node).join('')}</div>`; if(data.bullets) content=`<div class="bullets">${data.bullets.map(item=>`<div>${item}</div>`).join('')}</div>`; if(data.code) content=`<pre class="code"><code>${data.code}</code></pre>`; return `<section class="slide"><div class="eyebrow">Gallo Tracking &middot; ${String(slides.indexOf(data)+1).padStart(2,'0')}</div><h2>${data.title}</h2><p>${data.text}</p>${content}</section>`; }
    root.innerHTML=slides.map(renderSlide).join(''); const elements=[...document.querySelectorAll('.slide')];
    function show(index){ current=Math.max(0,Math.min(index,elements.length-1)); elements.forEach((el,i)=>el.classList.toggle('active',i===current)); counter.textContent=`${current+1} / ${elements.length}`; progress.style.width=`${((current+1)/elements.length)*100}%`; prev.disabled=current===0; next.disabled=current===elements.length-1; history.replaceState(null,'',`#slide-${current+1}`); }
    prev.onclick=()=>show(current-1); next.onclick=()=>show(current+1); document.addEventListener('keydown',e=>{if(['ArrowLeft','PageUp'].includes(e.key))show(current-1);if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1);}if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();});
    const fullscreen=document.querySelector('#fullscreen'); fullscreen.onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.(); document.addEventListener('fullscreenchange',()=>{const active=Boolean(document.fullscreenElement); fullscreen.setAttribute('aria-label',active?'Sair da tela cheia':'Ativar tela cheia'); fullscreen.title=active?'Sair da tela cheia':'Tela cheia';}); let touchStart=0; document.addEventListener('touchstart',e=>touchStart=e.changedTouches[0].screenX,{passive:true}); document.addEventListener('touchend',e=>{const delta=e.changedTouches[0].screenX-touchStart;if(Math.abs(delta)>50)show(current+(delta<0?1:-1));},{passive:true}); const initial=Number(location.hash.replace('#slide-','')); show(initial>0?initial-1:0);
  </script>
</body>
</html>
