name: Testes e cobertura

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restaurar dependências
        run: dotnet restore GalloTracking.sln
      - name: Executar testes com cobertura
        run: dotnet test GalloTracking.sln --no-restore --settings coverage.runsettings --collect:"XPlat Code Coverage"
      - name: Validar cobertura mínima
        shell: bash
        run: |
          report=$(find . -path '*/TestResults/*/coverage.cobertura.xml' -print -quit)
          test -n "$report"
          rate=$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' "$report" | head -n 1)
          awk -v rate="$rate" 'BEGIN { if (rate < 0.90) exit 1 }'
      - name: Remover arquivos temporários e cobertura
        if: always()
        shell: bash
        run: |
          find . -type d \( -name bin -o -name obj -o -name TestResults -o -name coverage \) -prune -exec rm -rf {} +
